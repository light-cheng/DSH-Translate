name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.1.4)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    name: Pack & publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify version, syntax and tests
        id: pkg
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          EXPECTED_TAG="v${VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag ($TAG) does not match package.json version ($EXPECTED_TAG)" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm run check
          npm test

      - name: Pack and upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          mkdir -p tmp/release
          TARBALL="$(npm pack --pack-destination tmp/release | tail -n 1)"
          cp "tmp/release/${TARBALL}" "tmp/release/dsh-translate-${VERSION}.tgz"
          cp "tmp/release/${TARBALL}" "tmp/release/dsh-translate.tgz"
          gh release upload "$TAG" \
            "tmp/release/dsh-translate-${VERSION}.tgz" \
            "tmp/release/dsh-translate.tgz" \
            --clobber
          rm -rf tmp/release

      - name: Publish to npm
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published on npm; skipping."
            exit 0
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          fi
          if [[ "${VERSION}" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
