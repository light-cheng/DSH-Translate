<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH-Translate">
  <title>DSH-Translate</title>
  <!-- plate -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#22364C"/>
  <!-- card: 40 x 50, bottom-left corner turned up along a 45° crease -->
  <path d="M12 25 L12 11 A4 4 0 0 1 16 7 L48 7 A4 4 0 0 1 52 11 L52 53 A4 4 0 0 1 48 57 L44 57 Z" fill="#F2F5FA"/>
  <!-- the turned corner: apex is the mirror of the cut corner across the crease -->
  <path d="M12 25 L44 57 L44 25 Z" fill="#4D6BFE"/>
  <!-- two entries -->
  <rect x="20" y="10" width="26" height="4" rx="2" fill="#22364C"/>
  <rect x="20" y="18" width="16" height="4" rx="2" fill="#22364C"/>
</svg>
